<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anmeldung — Redaktion Finanzberatung Rieken</title>
<link rel="stylesheet" href="admin.css">
</head><body>
<div class="login">
  <img class="login__art" src="../../assets/art/rosette-ink.svg" alt="" aria-hidden="true">
  <div class="login__band"><img src="../../assets/art/band-light.svg" alt="" aria-hidden="true"></div>

  <div class="login__panel">
    <div class="login__logo">
      <span class="brandmark">
        <img src="../../assets/logo/signet-fine-tanne.svg" alt="">
        <span><b>Rieken</b><span>Finanzberatung · Hannover</span></span>
      </span>
    </div>

    <p class="label">Redaktion</p>
    <h1>Willkommen zurück,<br>Tobias.</h1>
    <p class="sub">Termine, Anfragen und Seiteninhalte an einer Stelle.</p>

    <form onsubmit="return false">
      <div class="field">
        <label class="label" for="mail">E-Mail</label>
        <input id="mail" type="email" value="info@trieken.com">
      </div>
      <div class="field is-focus">
        <label class="label" for="pw">Passwort</label>
        <input id="pw" type="password" value="••••••••••••">
      </div>
      <div class="login__row">
        <span class="check"><i></i>Angemeldet bleiben</span>
        <a class="link" href="#">Passwort vergessen</a>
      </div>
      <button class="btn btn--brass"><span>Anmelden</span><span>→</span></button>
    </form>

    <div class="login__foot">
      <span class="label">Zwei-Faktor aktiv</span>
      <span class="label">Betreuung: Novera Studio</span>
    </div>
  </div>
</div>
</body></html>
